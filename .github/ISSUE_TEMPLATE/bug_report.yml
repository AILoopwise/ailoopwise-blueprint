name: Something did not work
description: A step in the README or course failed, or the blueprint behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use the Security tab ("Report a vulnerability") instead of this form.
        Do not paste API keys, tokens or private data. Replace them with `xxx`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which step or file?
      placeholder: "README step 3, or course/03-server-optional.md, or blueprint/scripts/bootstrap.sh"
  - type: dropdown
    id: os
    attributes:
      label: Your system
      options:
        - macOS
        - Windows with WSL 2
        - Windows with Git for Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version`, `jq --version` and `bash --version | head -1`
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
